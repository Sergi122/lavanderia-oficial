<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escena 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfe6fb}#c{position:absolute;inset:0}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body><div id="c"></div>
<script type="module">
import { crearEscena, webglDisponible } from './escena3d.js';
// Avisos hacia Flutter: canal del WebView (móvil) o postMessage al padre (iframe web).
const avisar = (o) => { const s = JSON.stringify(o); if (window.FlutterBridge) window.FlutterBridge.postMessage(s); else parent.postMessage(s, '*'); };
window.__recibir = (s) => window.dispatchEvent(new MessageEvent('message', { data: s }));
const ok = webglDisponible();
if (!ok) avisar({ tipo: 'sinwebgl' });
else {
  const esc = crearEscena(document.getElementById('c'));
  window.__esc = esc;
  addEventListener('message', (e) => {
    let m = e.data; if (typeof m === 'string') { try { m = JSON.parse(m); } catch { return; } }
    if (!m || !m.tipo) return;
    if (m.tipo === 'datos') esc.set(m.datos || {});
    else if (m.tipo === 'explorar') esc.explorar(!!m.valor);
    else if (m.tipo === 'zoom') esc.zoom(m.valor || 1);
    else if (m.tipo === 'reset') esc.reset();
  });
  avisar({ tipo: 'listo' });
}
</script></body></html>
